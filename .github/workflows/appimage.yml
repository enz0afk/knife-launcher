name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Don't let two builds of the same branch race to update the nightly release
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "VERSION=nightly" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Assemble AppDir
        run: |
          D=build/KnifeLauncher.AppDir
          mkdir -p "$D/usr/share/soldatlauncher"
          cp launcher/launch.py launcher/cfgutil.py "$D/usr/share/soldatlauncher/"
          cp -r launcher/ui "$D/usr/share/soldatlauncher/"
          cp launcher/AppRun launcher/soldatlauncher.desktop "$D/"
          cp launcher/ui/icon.png "$D/knifelauncher.png"
          chmod +x "$D/AppRun"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sed -i \
              -e "s/^Name=.*/Name=Knife Launcher ${VERSION}/" \
              -e "s/^X-AppImage-Version=.*/X-AppImage-Version=${VERSION}/" \
              "$D/soldatlauncher.desktop"
          fi

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # GitHub runners have no FUSE, so run appimagetool unpacked
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            build/KnifeLauncher.AppDir "KnifeLauncher-${VERSION}.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: KnifeLauncher-${{ env.VERSION }}
          path: KnifeLauncher-*.AppImage

      - name: Attach to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: KnifeLauncher-*.AppImage

      - name: Update nightly pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push -f origin nightly
          gh release delete nightly --yes || true
          gh release create nightly KnifeLauncher-nightly.AppImage \
            --prerelease \
            --title "Nightly build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. May be unstable; use a numbered release for normal play."
